name: Update Toffee Live M3U Playlist

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'generate_playlist.py'
      - '.github/workflows/update-playlist.yml'

jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Generate M3U playlist
        env:
          TOFFEE_DEVICE_TOKEN: ${{ secrets.TOFFEE_DEVICE_TOKEN }}
        run: |
          python generate_playlist.py \
            --output toffee_live \
            --format both
      
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add generated files
          git add toffee_live.m3u toffee_live.json || true
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Toffee Live playlist - ${{ steps.date.outputs.date }}"
            git push
          fi
      
      - name: Create Release (on schedule)
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: playlist-${{ github.run_number }}
          name: Toffee Live Playlist - ${{ steps.date.outputs.date }}
          body: |
            Auto-generated Toffee Live M3U playlist
            
            **Generated:** ${{ steps.date.outputs.date }}
            **Run:** ${{ github.run_number }}
            
            ## Files
            - `toffee_live.m3u` - M3U playlist format
            - `toffee_live.json` - JSON format with metadata
            
            ## Usage
            
            ### M3U Playlist
            ```
            https://github.com/${{ github.repository }}/releases/download/playlist-${{ github.run_number }}/toffee_live.m3u
            ```
            
            ### JSON Data
            ```
            https://github.com/${{ github.repository }}/releases/download/playlist-${{ github.run_number }}/toffee_live.json
            ```
          files: |
            toffee_live.m3u
            toffee_live.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toffee-live-playlist
          path: |
            toffee_live.m3u
            toffee_live.json
          retention-days: 30
